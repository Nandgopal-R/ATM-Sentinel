<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo controls</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 26 26%27%3E%3Crect width=%2726%27 height=%2726%27 rx=%277%27 fill=%27%233b4cc0%27/%3E%3Crect x=%276%27 y=%278%27 width=%2714%27 height=%273%27 rx=%271.5%27 fill=%27white%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body class="democtl">
<div class="bar">
  <a class="brand" href="/"><svg viewBox="0 0 26 26" aria-hidden="true"><rect width="26" height="26" rx="7" fill="var(--brand)"/><rect x="6" y="8" width="14" height="3" rx="1.5" fill="var(--brand-ink)"/><rect x="9" y="13" width="8" height="6" rx="1" fill="var(--brand-ink)" opacity=".6"/></svg>ATM Sentinel</a>
  <div class="end"><form method="post" action="/admin/logout"><button class="btn" type="submit">Sign out</button></form></div>
</div>
<main>
  <section>
    <p class="atm"><span id="dot" class="dot"></span><b id="name">ATM</b> <span id="online">checking…</span></p>
    <button class="big yes" type="button" data-d="1">Cash dispensed</button>
    <button class="big no" type="button" data-d="0">Not dispensed</button>
    <p id="msg" class="msg" role="status" aria-live="polite"></p>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const buttons = [...document.querySelectorAll(".big")];
let online = false, busy = false;
const sync = () => buttons.forEach(b => b.disabled = busy || !online);

async function status() {
  try {
    const r = await fetch("/api/demo/status");
    if (r.status === 401) return location.assign("/admin/login");
    const d = await r.json();
    online = d.online;
    $("name").textContent = d.name;
    $("online").textContent = online ? "Online" : "Offline";
  } catch { online = false; $("online").textContent = "Can't reach the server"; }
  $("dot").className = "dot " + (online ? "on" : "off");
  sync();
}

buttons.forEach(b => b.addEventListener("click", async () => {
  busy = true; sync();
  const label = b.textContent;
  try {
    const r = await fetch("/api/demo/txn", {method: "POST", headers: {"Content-Type": "application/json"},
                                            body: JSON.stringify({dispensed: b.dataset.d === "1"})});
    const d = await r.json();
    $("msg").textContent = r.ok ? `Sent ✓ ${label} · ${new Date(d.at * 1000).toLocaleTimeString()}` : d.error;
    $("msg").className = "msg " + (r.ok ? "good" : "bad");
  } catch { $("msg").textContent = "Can't reach the server."; $("msg").className = "msg bad"; }
  setTimeout(() => { busy = false; sync(); }, 3000);
}));

status();
setInterval(status, 3000);
</script>
</body>
</html>
